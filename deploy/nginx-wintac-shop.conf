# ============================================================
# nginx — WIN TAC, fase previa al cambio de dominio (wintac.shop)
# Destino: /etc/nginx/sites-available/wintac.shop
#
# Igual que deploy/nginx-wintac.conf (URLs amigables, 301 desde las URLs
# .php antiguas) pero con el certificado actual de wintac.shop y
# www.wintac.shop redirigiendo a wintac.shop. Cuando el DNS de
# www.wintac.com.pe esté listo, se reemplaza por nginx-wintac.conf
# (DEPLOY.md → sección 11).
# ============================================================

# URLs antiguas con ".php" → versión limpia (solo GET)
map "$request_method:$request_uri" $wintac_url_limpia {
    default "";
    "~^GET:/index\.php(?<q>\?.*)?$"                          "/$q";
    "~^GET:/producto\.php\?(?:.*&)?id=(?<id>\d+)"             "/producto/$id";
    "~^GET:/(?<p>(?:cuenta/)?[a-z][a-z-]*)\.php(?<q>\?.*)?$"  "/$p$q";
}

server {
    listen 443 ssl;
    server_name wintac.shop www.wintac.shop;

    ssl_certificate /etc/letsencrypt/live/wintac.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wintac.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ecomerce;
    index index.php index.html;
    client_max_body_size 12m;

    if ($host = www.wintac.shop) {
        return 301 https://wintac.shop$request_uri;
    }
    if ($wintac_url_limpia) {
        return 301 $wintac_url_limpia;
    }

    location ~ ^/trabajacon-nosotros(\.php)?$ {
        return 301 /trabaja-con-nosotros;
    }

    location = /sitemap.xml { rewrite ^ /sitemap.php last; }
    location = /robots.txt  { rewrite ^ /robots.php last; }

    rewrite ^/producto/(\d+)(?:/[^/]*)?/?$ /producto.php?id=$1 last;

    location ^~ /database/ {
        deny all;
        return 404;
    }

    location ^~ /deploy/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ @sin_extension;
    }

    location @sin_extension {
        rewrite ^(.+?)/?$ $1.php last;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/wintac.sock;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|ico)$ {
        expires 30d;
        access_log off;
    }
}

server {
    listen 80;
    server_name wintac.shop www.wintac.shop;
    return 301 https://wintac.shop$request_uri;
}
