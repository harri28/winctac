# ============================================================
# nginx — WIN TAC en producción (dominio principal www.wintac.com.pe)
# Destino: /etc/nginx/sites-available/wintac.shop (ya enlazado en sites-enabled)
#
# Mismas reglas de URLs amigables que el .htaccess (que nginx ignora):
# mantener ambos archivos sincronizados. Ver DEPLOY.md → "Dominio
# www.wintac.com.pe y URLs amigables" para el orden de instalación.
# ============================================================

# URLs antiguas con ".php" → versión limpia (solo GET; POST no se redirige
# porque perdería el cuerpo del formulario). Vacío = no redirigir.
map "$request_method:$request_uri" $wintac_url_limpia {
    default "";
    "~^GET:/index\.php(?<q>\?.*)?$"                                  "/$q";
    "~^GET:/producto\.php\?(?:.*&)?id=(?<id>\d+)"                     "/producto/$id";
    "~^GET:/(?<p>(?:cuenta/)?[a-z][a-z-]*)\.php(?<q>\?.*)?$"          "/$p$q";
}

# Cualquier dominio que no sea el principal → 301 a https://www.wintac.com.pe
server {
    listen 80;
    listen [::]:80;
    server_name www.wintac.com.pe wintac.com.pe wintac.shop www.wintac.shop;
    return 301 https://www.wintac.com.pe$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wintac.com.pe wintac.shop www.wintac.shop;

    ssl_certificate     /etc/letsencrypt/live/www.wintac.com.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wintac.com.pe/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.wintac.com.pe$request_uri;
}

# Sitio principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.wintac.com.pe;

    ssl_certificate     /etc/letsencrypt/live/www.wintac.com.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.wintac.com.pe/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ecomerce;
    index index.php index.html;
    client_max_body_size 12m;   # CV en PDF de hasta 10 MB (Trabaja con nosotros)

    if ($wintac_url_limpia) {
        return 301 $wintac_url_limpia;
    }

    # Enlace con error de escritura citado en el informe de evaluación
    location ~ ^/trabajacon-nosotros(\.php)?$ {
        return 301 /trabaja-con-nosotros;
    }

    location = /sitemap.xml { rewrite ^ /sitemap.php last; }
    location = /robots.txt  { rewrite ^ /robots.php last; }

    # /producto/{id}/{slug} → producto.php?id={id}
    rewrite ^/producto/(\d+)(?:/[^/]*)?/?$ /producto.php?id=$1 last;

    location ^~ /database/ {
        deny all;
        return 404;
    }

    location ^~ /deploy/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # /pagina → pagina.php (nunca servir un .php como archivo estático)
    location / {
        try_files $uri $uri/ @sin_extension;
    }

    location @sin_extension {
        rewrite ^(.+?)/?$ $1.php last;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/wintac.sock;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|ico)$ {
        expires 30d;
        access_log off;
    }
}
